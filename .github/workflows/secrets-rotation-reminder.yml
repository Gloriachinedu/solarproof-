name: Secrets Rotation Reminder

# Runs on the 1st of every month at 09:00 UTC and can be triggered manually.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, do not create issues'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check-secret-ages:
    name: Check secret ages and create rotation reminders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Gitleaks verification — confirm the scanner is present and configured
      # -----------------------------------------------------------------------
      - name: Verify Gitleaks configuration exists
        run: |
          if [ ! -f ".gitleaks.toml" ]; then
            echo "::warning::No .gitleaks.toml found — secret scanning may use default rules only."
          else
            echo "✅ .gitleaks.toml found"
          fi

      # -----------------------------------------------------------------------
      # Rotation schedule — defined here as the single source of truth.
      # Each entry:  SECRET_NAME | MAX_AGE_DAYS | OWNER | PROCEDURE
      # -----------------------------------------------------------------------
      - name: Define rotation schedule
        id: schedule
        run: |
          cat <<'EOF' > /tmp/rotation-schedule.tsv
          SECRET_NAME	MAX_AGE_DAYS	OWNER	PROCEDURE
          SUPABASE_SERVICE_ROLE_KEY	90	backend-team	See docs/SECRETS_ROTATION.md §4
          MINTER_SECRET_KEY	180	contracts-team	See docs/SECRETS_ROTATION.md §5
          NEXT_PUBLIC_SUPABASE_ANON_KEY	365	backend-team	See docs/SECRETS_ROTATION.md §4
          STELLAR_TESTNET_SECRET_KEY	180	contracts-team	See docs/SECRETS_ROTATION.md §5
          VERCEL_TOKEN	90	devops-team	See docs/SECRETS_ROTATION.md §6
          TURBO_TOKEN	90	devops-team	See docs/SECRETS_ROTATION.md §6
          EOF
          echo "schedule_file=/tmp/rotation-schedule.tsv" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Check GitHub secret updated-at timestamps via the API.
      # Secrets whose `updated_at` exceeds MAX_AGE_DAYS are flagged.
      # -----------------------------------------------------------------------
      - name: Audit GitHub secret ages
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          from datetime import datetime, timezone

          repo   = os.environ["REPO"]
          token  = os.environ["GH_TOKEN"]
          today  = datetime.now(timezone.utc)

          # Fetch secret list from GitHub API (only names + updated_at are available)
          result = subprocess.run(
              ["gh", "api", f"/repos/{repo}/actions/secrets", "--paginate",
               "--jq", ".secrets[] | {name: .name, updated_at: .updated_at}"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print("::warning::Could not list repository secrets — check GITHUB_TOKEN scope.")
              sys.exit(0)

          secrets_info = {}
          for line in result.stdout.strip().splitlines():
              try:
                  entry = json.loads(line)
                  secrets_info[entry["name"]] = entry["updated_at"]
              except json.JSONDecodeError:
                  continue

          # Parse rotation schedule
          overdue = []
          with open("/tmp/rotation-schedule.tsv") as f:
              for i, row in enumerate(f):
                  if i == 0:
                      continue  # skip header
                  parts = row.strip().split("\t")
                  if len(parts) < 4:
                      continue
                  name, max_age_days, owner, procedure = parts[0], int(parts[1]), parts[2], parts[3]

                  updated_at_str = secrets_info.get(name)
                  if not updated_at_str:
                      # Secret not found in repo — treat as unknown age, flag it
                      overdue.append({
                          "name": name,
                          "age_days": "unknown",
                          "max_age_days": max_age_days,
                          "owner": owner,
                          "procedure": procedure,
                          "reason": "not found in repo secrets",
                      })
                      continue

                  updated_at = datetime.fromisoformat(updated_at_str.replace("Z", "+00:00"))
                  age_days = (today - updated_at).days

                  if age_days > max_age_days:
                      overdue.append({
                          "name": name,
                          "age_days": age_days,
                          "max_age_days": max_age_days,
                          "owner": owner,
                          "procedure": procedure,
                          "reason": f"last rotated {age_days}d ago (limit {max_age_days}d)",
                      })

          if overdue:
              print(f"::warning::{len(overdue)} secret(s) need rotation")
              with open("/tmp/overdue.json", "w") as out:
                  json.dump(overdue, out, indent=2)
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write("has_overdue=true\n")
          else:
              print("✅ All monitored secrets are within their rotation window.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write("has_overdue=false\n")
          PYEOF

      # -----------------------------------------------------------------------
      # Create a GitHub issue for each overdue secret (unless dry-run).
      # Uses a title fingerprint to avoid duplicate open issues.
      # -----------------------------------------------------------------------
      - name: Create rotation reminder issues
        if: steps.audit.outputs.has_overdue == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          repo = os.environ["REPO"]
          with open("/tmp/overdue.json") as f:
              overdue = json.load(f)

          for secret in overdue:
              title = f"[Security] Rotate secret: {secret['name']}"

              # Check if an open issue with this title already exists
              existing = subprocess.run(
                  ["gh", "issue", "list", "--repo", repo,
                   "--state", "open", "--search", title,
                   "--json", "number,title", "--jq", ".[].number"],
                  capture_output=True, text=True
              ).stdout.strip()

              if existing:
                  print(f"ℹ️  Issue already open for {secret['name']} (#{existing}), skipping.")
                  continue

              body = f"""## Secret Rotation Required

**Secret:** `{secret['name']}`
**Reason:** {secret['reason']}
**Owner:** @{secret['owner']}
**Rotation procedure:** {secret['procedure']}

### Steps
1. Follow the rotation procedure linked above.
2. Update the secret in GitHub → Settings → Secrets and Variables → Actions.
3. Close this issue once rotation is complete and verified.

> This issue was created automatically by the `secrets-rotation-reminder` workflow.
> See [`docs/SECRETS_ROTATION.md`](../../blob/main/docs/SECRETS_ROTATION.md) for full procedures.
"""
              subprocess.run(
                  ["gh", "issue", "create", "--repo", repo,
                   "--title", title,
                   "--body", body,
                   "--label", "security,maintenance"],
                  check=True
              )
              print(f"✅ Created rotation reminder issue for {secret['name']}")
          PYEOF

      # -----------------------------------------------------------------------
      # Dry-run: print a report without creating issues.
      # -----------------------------------------------------------------------
      - name: Print dry-run report
        if: steps.audit.outputs.has_overdue == 'true' && inputs.dry_run == 'true'
        run: |
          echo "### Dry-run — overdue secrets (no issues created)"
          python3 -c "import json; [print(f\"  - {s['name']}: {s['reason']}\") for s in json.load(open('/tmp/overdue.json'))]"
